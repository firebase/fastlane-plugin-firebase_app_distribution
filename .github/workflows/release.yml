name: Build and publish to RubyGems

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: 3.2

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
          token_format: 'access_token'

      - name: Publish to RubyGems via OSS Exit Gate
        env:
          GEM_HOST_API_KEY: "Bearer ${{ steps.auth.outputs.access_token }}"
        run: |
          gem build *.gemspec
          GEM_FILE=$(ls -1 *.gem | head -n 1)
          VERSION=$(ruby -r rubygems -e "puts Gem::Specification.load(Dir.glob('*.gemspec').first).version")
          gem push "$GEM_FILE" --host https://us-ruby.pkg.dev/oss-exit-gate-prod/fastlane-plugin-firebase-a--rubygems
          printf '{"package":"fastlane-plugin-firebase_app_distribution","version":"%s"}\n' "$VERSION" > manifest.json
          gcloud storage cp manifest.json "gs://oss-exit-gate-prod-fastlane-plugin-firebase-a--rubygems-manifests/fastlane-plugin-firebase_app_distribution/${VERSION}/manifest.json"
